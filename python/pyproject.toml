[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epitaxy"
version = "0.1.0"
description = "Run firmware tests on real MCU dev boards (epitaxy.dev)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
dependencies = ["httpx>=0.25"]

[project.urls]
Homepage = "https://epitaxy.dev"
Source = "https://github.com/epitaxylabs/epitaxy-sdk"

[tool.setuptools.packages.find]
where = ["src"]
